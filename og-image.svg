<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0f11"/>
      <stop offset="100%" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#f0c040"/>
      <stop offset="60%" stop-color="#5b9cf6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f0c040" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f0c040" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#e8eaf0" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow blob top-left -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="#f0c040" opacity="0.04"/>
  <!-- Glow blob bottom-right -->
  <ellipse cx="1000" cy="450" rx="280" ry="180" fill="#5b9cf6" opacity="0.05"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent-line)"/>

  <!-- Border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#2a2d35" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="4" height="120" rx="2" fill="#f0c040"/>

  <!-- BETA pill -->
  <rect x="80" y="100" width="60" height="24" rx="12" fill="#f0c04015" stroke="#f0c04030" stroke-width="1"/>
  <text x="110" y="116" font-family="monospace" font-size="10" fill="#f0c040" text-anchor="middle" letter-spacing="1">BETA</text>

  <!-- Main title -->
  <text x="100" y="215" font-family="Georgia, serif" font-size="88" font-weight="700" fill="#e8eaf0" font-style="italic">EconPedia</text>

  <!-- Accent dot on the i -->
  <circle cx="386" cy="148" r="5" fill="#f0c040"/>

  <!-- Tagline -->
  <text x="100" y="268" font-family="Georgia, serif" font-size="26" fill="#8b92a5" font-style="italic">Economics, finally explained.</text>

  <!-- Divider line -->
  <rect x="100" y="295" width="600" height="1" fill="#2a2d35"/>

  <!-- Stats row -->
  <g font-family="Georgia, serif">
    <!-- 125 Terms -->
    <text x="100" y="348" font-size="40" font-weight="700" fill="#f0c040">125</text>
    <text x="100" y="372" font-size="14" fill="#5a6072" font-family="monospace" letter-spacing="1">TERMS</text>

    <rect x="220" y="325" width="1" height="60" fill="#2a2d35"/>

    <!-- 8 Categories -->
    <text x="240" y="348" font-size="40" font-weight="700" fill="#f0c040">8</text>
    <text x="240" y="372" font-size="14" fill="#5a6072" font-family="monospace" letter-spacing="1">CATEGORIES</text>

    <rect x="390" y="325" width="1" height="60" fill="#2a2d35"/>

    <!-- AI -->
    <text x="410" y="348" font-size="40" font-weight="700" fill="#f0c040">✨</text>
    <text x="410" y="372" font-size="14" fill="#5a6072" font-family="monospace" letter-spacing="1">AI-POWERED</text>

    <rect x="570" y="325" width="1" height="60" fill="#2a2d35"/>

    <!-- Free -->
    <text x="590" y="348" font-size="40" font-weight="700" fill="#f0c040">✓</text>
    <text x="590" y="372" font-size="14" fill="#5a6072" font-family="monospace" letter-spacing="1">FREE FOREVER</text>
  </g>

  <!-- Right side — category pills -->
  <g font-family="monospace" font-size="12" letter-spacing="0.5">
    <!-- Macroeconomics -->
    <rect x="760" y="120" width="200" height="32" rx="16" fill="#2563eb18" stroke="#2563eb35" stroke-width="1"/>
    <text x="860" y="141" fill="#5b9cf6" text-anchor="middle">🌍 Macroeconomics</text>

    <!-- Personal Finance -->
    <rect x="980" y="120" width="180" height="32" rx="16" fill="#16a34a18" stroke="#16a34a35" stroke-width="1"/>
    <text x="1070" y="141" fill="#4caf82" text-anchor="middle">💰 Personal Finance</text>

    <!-- Investing -->
    <rect x="800" y="168" width="140" height="32" rx="16" fill="#9333ea18" stroke="#9333ea35" stroke-width="1"/>
    <text x="870" y="189" fill="#a855f7" text-anchor="middle">📈 Investing</text>

    <!-- Digital & Tech -->
    <rect x="960" y="168" width="190" height="32" rx="16" fill="#ea580c18" stroke="#ea580c35" stroke-width="1"/>
    <text x="1055" y="189" fill="#f97316" text-anchor="middle">💻 Digital & Tech</text>

    <!-- Banking -->
    <rect x="760" y="216" width="210" height="32" rx="16" fill="#0891b218" stroke="#0891b235" stroke-width="1"/>
    <text x="865" y="237" fill="#22d3ee" text-anchor="middle">🏦 Banking & Institutions</text>

    <!-- Economics Theory -->
    <rect x="990" y="216" width="170" height="32" rx="16" fill="#b4530918" stroke="#b4530935" stroke-width="1"/>
    <text x="1075" y="237" fill="#d97706" text-anchor="middle">📚 Econ Theory</text>

    <!-- Business -->
    <rect x="810" y="264" width="220" height="32" rx="16" fill="#dc262618" stroke="#dc262635" stroke-width="1"/>
    <text x="920" y="285" fill="#f87171" text-anchor="middle">🚀 Business & Entrepreneurship</text>

    <!-- Economic History -->
    <rect x="1050" y="264" width="110" height="32" rx="16" fill="#4b556318" stroke="#4b556335" stroke-width="1"/>
    <text x="1105" y="285" fill="#9ca3af" text-anchor="middle">🏛️ History</text>
  </g>

  <!-- Sample terms -->
  <g font-family="Georgia, serif" font-style="italic">
    <text x="760" y="360" font-size="15" fill="#2a2d35">———————————————————————————</text>
    <text x="760" y="390" font-size="16" fill="#5a6072">GDP · Inflation · Compound Interest ·</text>
    <text x="760" y="415" font-size="16" fill="#5a6072">Bitcoin · Fiscal Policy · Recession ·</text>
    <text x="760" y="440" font-size="16" fill="#5a6072">Dollar-Cost Averaging · ESG · ROI…</text>
  </g>

  <!-- URL -->
  <text x="100" y="548" font-family="monospace" font-size="15" fill="#363a45" letter-spacing="1">econpedia.vercel.app</text>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent-line)"/>
</svg>
